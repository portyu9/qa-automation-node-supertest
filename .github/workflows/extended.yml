name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "5 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supertest-extended-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: 11.19.1

jobs:
  listener-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts "npm@${NPM_VERSION}" --no-audit --no-fund
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Exercise real local TCP listener with deterministic dependency
        run: npm run test:live-smoke
      - name: Validate meaningful listener evidence
        run: node scripts/validate-listener-evidence.js
      - name: Publish listener observability summary
        if: always()
        run: |
          mkdir -p reports
          {
            echo "### Supertest / Express listener contract · Node ${{ matrix.node }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Transport: \`127.0.0.1\` ephemeral TCP listener"
            echo "- Upstream: injected deterministic client (no external network)"
            echo "- Job status: \`${{ job.status }}\`"
            echo "- npm: \`${NPM_VERSION}\`"
            echo '- Dependencies: exact npm qualification + lockfile, lifecycle scripts disabled'
            echo '- Evidence: validated listener manifest + CI summary'
            echo '- Coverage intent: listener + middleware + correlation + routing + serialization'
          } | tee "reports/listener-node-${{ matrix.node }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload extended evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supertest-listener-node-${{ matrix.node }}-evidence
          path: reports/
          if-no-files-found: error
          retention-days: 14

  extended-gate:
    name: extended-gate
    if: always()
    needs: [listener-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate listener compatibility matrix
        env:
          LISTENER: ${{ needs.listener-contract.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LISTENER" == "success" ]] || { echo "listener-contract=$LISTENER"; exit 1; }
