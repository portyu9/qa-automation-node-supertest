name: normalize-versionless-docs
on:
  push:
    branches: [chore/versionless-docs]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Normalize Supertest documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('README.md'),*sorted(Path('docs').rglob('*.md'))]
          techs=['Node.js','Node','npm','Supertest','Express','Jest','Pact','Docker','ESLint','Trivy','CodeQL']
          exact={'Node 22 and 24':'supported Node runtimes','Node 22/24':'supported Node runtimes','Node 24 primary':'primary Node runtime','Node 22 compatibility':'additional Node compatibility','npm@11.19.1':'npm','npm 11.19.1':'npm'}
          for path in files:
            text=path.read_text(encoding='utf-8')
            for a,b in exact.items(): text=text.replace(a,b)
            for tech in techs:
              text=re.sub(rf'(?i)\b{re.escape(tech)}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?(?:\s+LTS)?(?:\*\*|`)?',tech,text)
            text=re.sub(r'(?i)\bnpm@\d+(?:\.\d+)*','npm',text)
            text=re.sub(r'(?i)\bnode:\d[^\s`"\)]+','node:<pinned-tag>',text)
            text=text.replace('Node and Node','supported Node runtimes')
            path.write_text(text,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          names=r'(?:Node\.js|Node|npm|Supertest|Express|Jest|Pact|Docker|ESLint|Trivy|CodeQL)'
          pats=[re.compile(rf'(?i)\b{names}\s+(?:\*\*|`)?v?\d+(?:\.\d+)*(?:\.x)?'),re.compile(r'(?i)\bnpm@\d'),re.compile(r'(?i)\bnode:\d')]
          bad=[]
          for p in [Path('README.md'),*sorted(Path('docs').rglob('*.md'))]:
            for n,l in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              if any(x.search(l) for x in pats): bad.append(f'{p}:{n}: {l}')
          if bad: print('\n'.join(bad)); raise SystemExit(1)
          PY
          python3 .github/scripts/validate_readme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/doc-version-normalize.yml
          git add -A
          git diff --cached --check
          git commit -m "docs: make technology documentation versionless"
          git push origin HEAD
