name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-supertest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:coverage
      - name: Publish CI observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          NODE_VERSION: ${{ matrix.node }}
        run: |
          mkdir -p reports
          node - <<'NODE'
          const fs = require('node:fs');
          const nodeVersion = process.env.NODE_VERSION;
          const payload = {
            schemaVersion: 1,
            framework: 'jest-supertest-pact',
            runId: process.env.TEST_RUN_ID,
            dimension: { node: nodeVersion },
            status: process.env.JOB_STATUS,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
          };
          fs.writeFileSync(`reports/ci-observability-node-${nodeVersion}.json`, `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          {
            echo "### Supertest / Pact · Node ${{ matrix.node }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- Evidence: Jest coverage + Pact artifacts + CI observability envelope'
          } | tee "reports/ci-summary-node-${{ matrix.node }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage and contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supertest-node-${{ matrix.node }}-evidence
          path: |
            coverage/
            pacts/
            reports/
          if-no-files-found: ignore
          retention-days: 14

  container:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build tracked application image
        run: docker build -t qa-supertest:ci .
      - name: Validate packaged test entrypoint
        run: docker run --rm qa-supertest:ci
