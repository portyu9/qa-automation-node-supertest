name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-supertest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run test:coverage
      - name: Upload coverage and contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertest-node-${{ matrix.node }}-evidence
          path: |
            coverage/
            pacts/
          if-no-files-found: ignore
          retention-days: 14
