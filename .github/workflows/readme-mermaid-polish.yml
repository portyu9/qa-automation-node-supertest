name: Apply README Mermaid polish

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Replace Architecture Mermaid block
        env:
          MERMAID_B64: 
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          anchor = text.index("## Architecture")
          start = text.index("```mermaid", anchor)
          end = text.index("\n```", start) + len("\n```")
          replacement = base64.b64decode(os.environ["MERMAID_B64"]).decode("utf-8")
          updated = text[:start] + replacement + text[end:]
          if updated == text:
              raise SystemExit("README Mermaid replacement produced no change")
          path.write_text(updated, encoding="utf-8")
          PY
          rm .github/workflows/readme-mermaid-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/readme-mermaid-polish.yml
          git commit -m "docs: polish README architecture diagram"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
